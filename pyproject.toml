[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micropython-ld2410"
version = "0.1.0"
description = "MicroPython driver for HLK-LD2410C human presence radar sensor"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
  { name = "Mariusz Jurgielewicz", email = "mordor@mail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: MicroPython",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Hardware",
]
keywords = ["micropython", "ld2410", "radar", "sensor", "presence", "driver"]
dependencies = []

[project.urls]
Homepage = "https://github.com/melastmohican/micropython-ld2410"
Source = "https://github.com/melastmohican/micropython-ld2410"
Issues = "https://github.com/melastmohican/micropython-ld2410/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ld2410"]

[tool.hatch.build.targets.sdist]
include = [
  "src/ld2410",
  "examples",
  "README.md",
  "LICENSE",
]
